<!doctype html>
<!--
  Corpus pipeline fixture — bucket `E` (hashed / CSS-in-JS classes).

  Every element carries a generated class name in one of the shapes real CSS-in-JS
  toolchains emit (`sc-` from styled-components, `_` from CSS modules, `name-<hex>` from
  CSS-module hashing). Bucket `E` requires >= 20 *distinct* hashed tokens and a hashed
  ratio >= 0.20 (`BUCKET_THRESHOLDS`), so the count is deliberate: a page with three
  hashed classes is not a bucket-`E` page, it is a bucket-`A` page with a build step.

  The semantic classes next to them are deliberate too. A page where *every* token is
  hashed is the easy case; the hard case — and the one the selector generator has to
  survive — is a page where a handful of readable names sit on top of dozens that mean
  nothing.
-->
