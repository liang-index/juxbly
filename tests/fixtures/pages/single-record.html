<!doctype html>
<!--
  Fixture: one record behind an optional container selector (stage 1-5).

  `single` mode, the shape a "track one value on a page I visit often" tool produces.
  The container is what makes it a record rather than three unrelated values.

  Bucket A for the Phase 2 corpus (docs/contributing/BENCHMARK_GUIDE.md): structural
  difficulty "regular".
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Profile</title>
  </head>
  <body>
    <h1>Profile</h1>
    <div class="profile">
      <h2 class="name">Ada Lovelace</h2>
      <span class="role">Research lead</span>
      <span class="location">London</span>
    </div>
    <div class="footer">Unrelated footer text that must never be picked up</div>
  </body>
</html>
