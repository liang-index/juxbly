name: Bug report
description: Something is broken. One bug per report, please.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: search existing issues, and check the
        [known limitations](https://github.com/liang-index/Juxbly#readme) — this is a pre-release
        build and much of the product is not implemented yet.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open …
        2. Describe …
        3. See error
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - content script (floating ball / panels)
        - background service worker
        - popup / options page
        - build flow (highlight confirmation)
        - run flow (results / export)
        - health / repair / versions
        - docs
        - other / not sure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: Chrome version, OS, extension build (commit hash), page involved
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Evidence
      description: |
        Screenshots or console output. **Never paste API keys, tokens, cookies, or private page content.**
        Redact page data before attaching.
    validations:
      required: false
