name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Keep in sync with the `packageManager` field in package.json
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Prepare WXT types
        # The extension entrypoints are type-checked too, and they import the types WXT
        # generates into apps/extension/.wxt — this must run before `pnpm typecheck`.
        run: pnpm --filter @juxbly/extension run prepare

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
